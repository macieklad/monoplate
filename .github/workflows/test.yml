name: Run unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "!master"

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Use Node.js v24.12.0 (LTS)
        uses: ./.github/actions/setup-node-environment
        with:
          node-version: 24.12.0

      - name: Cache for Turborepo
        uses: rharkor/caching-for-turbo@v2.3.5

      - name: Run tests
        run: bun run test:affected
